name: Release pyserial wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-amd64
            runner: windows-latest
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-14
          - target: linux-x86_64
            runner: ubuntu-latest
          - target: linux-aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S native -B build/native -A x64

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build/native --config Release

      - name: Configure native library (macOS and Linux)
        if: runner.os != 'Windows'
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native library (macOS and Linux)
        if: runner.os != 'Windows'
        run: cmake --build build/native --parallel

      - name: Build pyserial wheel
        env:
          SBGC32_WHEEL_BACKEND: pyserial
          SBGC32_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0.dev0' }}
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/pyserial
          merge-multiple: true

      - name: Package all wheels in one archive
        run: |
          cd dist
          zip -r "sbgc32-pyserial-${GITHUB_REF_NAME}.zip" pyserial

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/pyserial/*.whl dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/pyserial/*.whl dist/*.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
