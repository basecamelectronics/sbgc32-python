name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      SBGC32_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -r docs/requirements.txt

      - name: Configure native library
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S native -B build/native -A x64

      - name: Configure native library
        if: runner.os != 'Windows'
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - run: cmake --build build/native --config Release
      - run: python -m sphinx -E -W --keep-going -b html docs/source docs/build/release-html
      - run: python -m build --wheel --outdir wheelhouse
      - run: python -m twine check wheelhouse/*.whl

      - name: Install and smoke-test built wheel
        run: >-
          python -c
          "import glob, subprocess, sys;
          subprocess.check_call([
              sys.executable, '-m', 'pip', 'install',
              '--force-reinstall', *glob.glob('wheelhouse/*.whl')
          ]);"

      - name: Verify the installed native protocol codec
        run: >-
          python -c
          "import sbgc32;
          from sbgc32.protocol import ProtocolCodec;
          codec = ProtocolCodec();
          assert codec.encode(73);
          print('Package and native protocol codec: OK')"

      - uses: actions/upload-artifact@v7
        with:
          name: sbgc32-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: sbgc32-*
          path: release-dist
          merge-multiple: true

      - name: Create GitHub Release and attach wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" release-dist/*.whl
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
