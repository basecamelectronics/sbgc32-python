name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyserial:
    name: Pyserial / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      SBGC32_VERSION: 0.0.0.dev0

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install checking tools
        run: python -m pip install --upgrade pip build twine ruff

      - name: Check code with Ruff
        run: python -m ruff check src examples

      - name: Check formatting
        run: python -m ruff format --check src examples

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation in strict mode
        run: python -m sphinx -E -W --keep-going -b html docs/source docs/build/ci-html

      - name: Configure native library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S native -B build/native -A x64

      - name: Configure native library on Linux and macOS
        if: runner.os != 'Windows'
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Build native library
        run: cmake --build build/native --config Release

      - name: Build wheel
        run: python -m build --wheel --outdir wheelhouse

      - name: Validate wheel metadata
        run: python -m twine check wheelhouse/*.whl

      - name: Install built wheel
        run: >-
          python -c
          "import glob, subprocess, sys;
          subprocess.check_call([
              sys.executable, '-m', 'pip', 'install',
              '--force-reinstall', *glob.glob('wheelhouse/*.whl')
          ])"

      - name: Smoke-test installed package
        run: >-
          python -c
          "import sbgc32;
          from sbgc32.protocol import ProtocolCodec;
          codec = ProtocolCodec();
          assert codec.encode(73);
          print('Package and native protocol codec: OK')"

      - name: Save wheel as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbgc32-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
